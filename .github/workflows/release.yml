name: Release installers (Windows/Linux/macOS)

# タグ(例: v0.5.1)をpushすると、open-english-server(RPoemベース静的
# 配信サーバー)をビルドし、Inno Setupでインストーラーをパッケージ化して
# GitHub Releasesへ添付する。server/src/self_update.rs(このリポジトリの
# 自動アップデート機能)がこのアセットを検出できるよう、`.iss`側の
# OutputBaseFilename(`open-english-installer.exe`、2026-08-25変更——
# 旧名`open-english-install.exe`は「インストーラーなのにinstallerと
# 書かれていない」と分かりにくかったため、他の全リポジトリと合わせて
# `<repo>-installer.exe`規則へ統一。旧名`open-english-setup-{version}.exe`
# はさらに旧い名前)と同じ、ファイル名に"install"(`installer`は`install`
# を含むため一致し続ける、旧リリースとの後方互換で"setup"も)を含む
# .exeとしてアップロードする。Linux/macOS版tarballも同様に
# `open-english-installer-<os_label>.tar.gz`へ統一。
#
# sibling path依存: server/Cargo.tomlが`../../RPoem/crates/
# open-runo-poem-compat`をpath依存しているため、CI環境でも同じ相対位置
# (このリポジトリのチェックアウトディレクトリの1つ上)へRPoemを
# checkoutする(他リポジトリで踏んだ「sibling path依存を忘れるとCI失敗」
# という罠を踏まないための対応、詳細はopen-raid-z/CLAUDE.md参照)。
# **さらに、RPoem自身が`open-web-server`(open-web-server-wire/-core/
# -ledger)へのsibling path依存を持つ**(RPoem単体のcheckoutだけでは
# 不十分——実際にこのワークフローの初回実行で踏んだ実バグ、2026-08-11)。
# **さらに、`RS-SmartTCP`自身も`open-raid-z`(open_raid_z_core/
# zfs_accel_hlsl、RAID-Z2/Z3パリティ計算ブリッジ)へのsibling path依存を
# 持つ**(v0.6.0リリースタグで初めて実際に踏んだCI失敗、2026-08-11)。
# **さらに、server/Cargo.tomlは`open-cpu`(SIMD実行基盤)と`RS-JSON`にも
# sibling path依存する**(この2つのcheckoutが漏れており、v0.7.0タグの
# リリースワークフローが`open-cpu`未取得で`cargo build --release`失敗——
# 2026-09-09に追加。以降v0.6.8のまま新リリースが出ていなかった原因)。

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Windows installer (Inno Setup)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout RPoem (sibling path dependency)
        run: git clone --depth=1 https://github.com/aon-co-jp/RPoem.git ../RPoem
      - name: Checkout open-web-server (RPoem's own sibling path dependency)
        run: git clone --depth=1 https://github.com/aon-co-jp/open-web-server.git ../open-web-server
      - name: Checkout RS-SmartTCP (open-web-server's own sibling path dependency)
        run: git clone --depth=1 https://github.com/aon-co-jp/RS-SmartTCP.git ../RS-SmartTCP
      - name: Checkout open-raid-z (RS-SmartTCP's own sibling path dependency)
        run: git clone --depth=1 https://github.com/aon-co-jp/open-raid-z.git ../open-raid-z
      - name: Checkout open-cpu (server/Cargo.toml sibling path dependency)
        run: git clone --depth=1 https://github.com/aon-co-jp/open-cpu.git ../open-cpu
      - name: Checkout RS-JSON (server/Cargo.toml sibling path dependency)
        run: git clone --depth=1 https://github.com/aon-co-jp/RS-JSON.git ../RS-JSON
      - name: Build open-english-server
        working-directory: server
        run: cargo build --release
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        working-directory: installer/windows
        shell: pwsh
        run: |
          # 2026-08-17変更: タグ名(例: v0.6.7)からバージョン番号を取り出し、
          # `/DMyAppVersion=...`でInno Setupへ渡す(Add/Remove Programsに
          # 表示されるバージョン番号を実際のリリースと同期させるため——
          # 従来は.iss内のハードコード値が何度もリリースを跨いで取り残され、
          # ファイル名(以前はバージョン入り)まで古いままになっていた
          # 実バグの根本対応)。ファイル名自体は`open-english-install.exe`
          # 固定(バージョン番号を含まない)なのでこのバージョン渡しは
          # Add/Remove Programsの表示のみに影響する。
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" open-english.iss
      - uses: actions/upload-artifact@v4
        with:
          name: open-english-windows-installer
          path: installer/windows/dist/*.exe

  build-unix-installer:
    name: Unix installer (${{ matrix.os_label }})
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            os_label: linux-x86_64
          - runner: macos-latest
            os_label: macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout RPoem (sibling path dependency)
        run: git clone --depth=1 https://github.com/aon-co-jp/RPoem.git ../RPoem
      - name: Checkout open-web-server (RPoem's own sibling path dependency)
        run: git clone --depth=1 https://github.com/aon-co-jp/open-web-server.git ../open-web-server
      - name: Checkout RS-SmartTCP (open-web-server's own sibling path dependency)
        run: git clone --depth=1 https://github.com/aon-co-jp/RS-SmartTCP.git ../RS-SmartTCP
      - name: Checkout open-raid-z (RS-SmartTCP's own sibling path dependency)
        run: git clone --depth=1 https://github.com/aon-co-jp/open-raid-z.git ../open-raid-z
      - name: Checkout open-cpu (server/Cargo.toml sibling path dependency)
        run: git clone --depth=1 https://github.com/aon-co-jp/open-cpu.git ../open-cpu
      - name: Checkout RS-JSON (server/Cargo.toml sibling path dependency)
        run: git clone --depth=1 https://github.com/aon-co-jp/RS-JSON.git ../RS-JSON
      - name: Build open-english-server
        working-directory: server
        run: cargo build --release
      - name: Package tarball
        run: |
          set -eu
          PKG="open-english-installer-${{ matrix.os_label }}"
          mkdir -p "$PKG/icons"
          cp server/target/release/open-english-server "$PKG/"
          # クライアント静的ファイルは submodule client/ (aon-co-jp/open-english-pc)
          # の client/web/ が正本(Phase 2b、2026-09-10)。README.md 以外を全て入れる。
          find client/web -maxdepth 1 -type f ! -name README.md -exec cp {} "$PKG/" \;
          cp client/web/icons/* "$PKG/icons/"
          cp installer/unix/install.sh installer/unix/fetch-aruaru-llm.sh "$PKG/"
          chmod +x "$PKG/install.sh" "$PKG/fetch-aruaru-llm.sh" "$PKG/open-english-server"
          tar -czf "$PKG.tar.gz" "$PKG"
      - uses: actions/upload-artifact@v4
        with:
          name: open-english-installer-${{ matrix.os_label }}
          path: open-english-installer-${{ matrix.os_label }}.tar.gz

  release:
    name: GitHub Releaseへ添付
    needs: [build-windows-installer, build-unix-installer]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            open-english-windows-installer/*.exe
            open-english-installer-linux-x86_64/*.tar.gz
            open-english-installer-macos-aarch64/*.tar.gz
